<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>緊急地震速報（EEW）ビューワ</title>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --text: #eaeff7;
      --muted: #9fb0c7;
      --ok: #2dd36f;
      --warn: #ffcc00;
      --bad: #ff4d4f;
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
    header { padding: 14px 16px; display:flex; gap:10px; align-items:center; border-bottom: 1px solid #223; }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .06em; }
    #statusBadge { padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    #statusBadge.ok { background: #11331f; color: var(--ok); }
    #statusBadge.warn { background: #332f11; color: var(--warn); }
    #statusBadge.bad { background: #331112; color: var(--bad); }
    main { display: grid; grid-template-columns: 420px 1fr; gap: 14px; padding: 14px; }
    @media (max-width: 980px){ main { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid #223; border-radius: 10px; padding: 14px; }
    .kvs { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; }
    .kvs div.key { color: var(--muted); text-align: right; }
    .big { font-size: 20px; font-weight: 800; letter-spacing: .04em; }
    #map { height: 62vh; min-height: 360px; border-radius: 10px; overflow: hidden; }
    .footer { color: var(--muted); font-size: 12px; display:flex; gap: 12px; align-items:center; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
  <header>
    <h1>緊急地震速報（EEW）</h1>
    <span id="statusBadge" class="ok">EEWなし</span>
    <div class="footer" id="meta">
      <span>取得対象: <span id="targetTime" class="mono">--</span></span>
      <span>最終更新: <span id="updatedAt" class="mono">--</span></span>
    </div>
  </header>

  <main>
    <section class="card" id="infoCard">
      <div class="big" id="headline">平常（EEWなし）</div>
      <div style="height:10px"></div>
      <div class="kvs">
        <div class="key">震源</div><div id="region">--</div>
        <div class="key">発生時刻</div><div id="originTime">--</div>
        <div class="key">最大推定震度</div><div id="calcIntensity">--</div>
        <div class="key">マグニチュード</div><div id="magnitude">--</div>
        <div class="key">深さ</div><div id="depth">--</div>
        <div class="key">緯度/経度</div><div id="latlon">--</div>
        <div class="key">レポートID/番号</div><div id="report">--</div>
        <div class="key">P波半径</div><div id="pRadius">--</div>
        <div class="key">S波半径</div><div id="sRadius">--</div>
      </div>
      <div style="height:12px"></div>
      <div class="footer">
        <span>データ: Yahoo!天気「リアルタイム震度」JSON</span>
        <span class="mono">/RealTimeData/yyyyMMdd/yyyyMMddHHmmss.json</span>
      </div>
    </section>

    <section class="card">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ====== 時刻ユーティリティ（JST） ======
    const TZ_OFFSET_MIN = 9 * 60; // JST
    const pad = (n, w=2) => String(n).padStart(w, '0');

    function toJSTDate(d=new Date()){
      // 内部Dateは常にUTC保持、表示はJSTに変換
      const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      return new Date(utc + TZ_OFFSET_MIN * 60000);
    }

    function formatJST(d){
      const y = d.getFullYear();
      const m = pad(d.getMonth()+1);
      const dd = pad(d.getDate());
      const hh = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      return { ymd:`${y}${m}${dd}`, ymdhms:`${y}${m}${dd}${hh}${mm}${ss}`, iso:`${y}-${m}-${dd} ${hh}:${mm}:${ss} JST` };
    }

    // ====== 取得URLを組み立て（既定は「現在の1秒前」） ======
    function buildUrl(secAgo = 1){
      const nowJST = toJSTDate();
      nowJST.setSeconds(nowJST.getSeconds() - secAgo);
      const f = formatJST(nowJST);
      return {
        url: `https://weather-kyoshin.west.edge.storage-yahoo.jp/RealTimeData/${f.ymd}/${f.ymdhms}.json`,
        human: f.iso
      };
    }

    // ====== Leaflet マップ初期化 ======
    const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([36.5, 137.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 予想円（P:青 / S:赤）
    const pCircle = L.circle([0,0], { radius: 0, color: '#399ade', fillColor: '#399ade', fillOpacity: 0.25 }).addTo(map);
    const sCircle = L.circle([0,0], { radius: 0, color: '#dc143c', fillColor: '#dc143c', fillOpacity: 0.12 }).addTo(map);
    const epicenterMarker = L.circleMarker([0,0], { radius: 6, color: '#fff', weight: 2, fillColor: '#ff4d4f', fillOpacity: 0.9 }).addTo(map);

    // ====== DOM参照 ======
    const $targetTime = document.getElementById('targetTime');
    const $updatedAt = document.getElementById('updatedAt');
    const $badge = document.getElementById('statusBadge');
    const $headline = document.getElementById('headline');
    const $region = document.getElementById('region');
    const $originTime = document.getElementById('originTime');
    const $calcIntensity = document.getElementById('calcIntensity');
    const $magnitude = document.getElementById('magnitude');
    const $depth = document.getElementById('depth');
    const $latlon = document.getElementById('latlon');
    const $report = document.getElementById('report');
    const $pRadius = document.getElementById('pRadius');
    const $sRadius = document.getElementById('sRadius');

    // ====== JSONを取得してUIに反映 ======
    async function fetchKyoshinJson() {
      // 1秒前から開始し、最大10秒遡ってリトライ
      let lastError;
      for (let back = 2; back <= 10; back++) {
        const { url, human } = buildUrl(back);
        $targetTime.textContent = human;
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          render(json);
          return;
        } catch (e) {
          lastError = e;
          // 次ループで再試行
        }
      }
      // 取得失敗時の表示
      $headline.textContent = 'データ取得エラー（再試行中）';
      $badge.className = 'bad';
      $badge.textContent = 'エラー';
      console.error('Fetch failed:', lastError);
    }

    function render(data){
      const nowDisp = formatJST(toJSTDate(new Date()));
      $updatedAt.textContent = nowDisp.iso;

      const hypo = data?.hypoInfo?.items?.[0] || null;
      const ps   = data?.psWave?.items?.[0] || null;

      const hasEEW = !!(hypo && ps);

      if (hasEEW) {
        $badge.className = 'warn';
        $badge.textContent = 'EEW発表中';
        $headline.textContent = `${hypo.regionName ?? '震源不明'}  /  M${hypo.magnitude ?? '?'}  震度推定: ${hypo.calcintensity ?? '-'}`;
      } else {
        $badge.className = 'ok';
        $badge.textContent = 'EEWなし';
        $headline.textContent = '平常（EEWなし）';
      }

      // テキスト部
      $region.textContent = hypo ? `${hypo.regionName}` : '—';
      $originTime.textContent = hypo?.originTime ?? '—';
      $calcIntensity.textContent = hypo?.calcintensity ?? '—';
      $magnitude.textContent = hypo?.magnitude ?? '—';
      $depth.textContent = hypo?.depth ?? '—';
      if (hypo?.latitude && hypo?.longitude) {
        // 緯度経度は "N37.7" / "E141.8" のような文字列
        $latlon.textContent = `${hypo.latitude} / ${hypo.longitude}`;
      } else {
        $latlon.textContent = '—';
      }
      $report.textContent = hypo ? `${hypo.reportId ?? '-'} / #${hypo.reportNum ?? '-'}` : '—';

      // 予想円＆震源プロット
      if (ps && hypo?.latitude && hypo?.longitude) {
        const toDeg = (s) => {
          // "N37.7" "S.." "E.." "W.."
          const dir = s[0], val = parseFloat(s.slice(1));
          if (Number.isNaN(val)) return null;
          if (dir === 'S' || dir === 'W') return -val;
          return val;
        };
        const lat = toDeg(hypo.latitude);
        const lon = toDeg(hypo.longitude);

        const pRkm = parseFloat(ps.pRadius); // km想定
        const sRkm = parseFloat(ps.sRadius);

        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          epicenterMarker.setLatLng([lat, lon]).setStyle({ opacity: 1 });

          const pMeters = Number.isFinite(pRkm) ? pRkm * 1000 : 0;
          const sMeters = Number.isFinite(sRkm) ? sRkm * 1000 : 0;

          pCircle.setLatLng([lat, lon]).setRadius(pMeters);
          sCircle.setLatLng([lat, lon]).setRadius(sMeters);

          map.flyTo([lat, lon], 6, { duration: 0.6 });
        }

        $pRadius.textContent = Number.isFinite(pRkm) ? `${pRkm.toFixed(1)} km` : '—';
        $sRadius.textContent = Number.isFinite(sRkm) ? `${sRkm.toFixed(1)} km` : '—';
      } else {
        pCircle.setRadius(0);
        sCircle.setRadius(0);
        epicenterMarker.setStyle({ opacity: 0 });
        $pRadius.textContent = '—';
        $sRadius.textContent = '—';
      }
    }

    // ====== 自動更新（毎秒） ======
    fetchKyoshinJson();
    setInterval(fetchKyoshinJson, 1000);
  </script>
</body>
