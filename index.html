<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>強震モニタ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width:100%; }
    .info {
      padding: 6px 8px;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ----------------------------------------
// ★ 指定された map 初期設定に変更
// ----------------------------------------
const map = L.map("map", {
  center: [34.5, 134.5],
  zoom: 4,
  maxZoom: 10,
  minZoom: 4,
  zoomControl: false
});

L.tileLayer("https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
  minZoom: 1,
  attribution: "© GSI Japan",
}).addTo(map);

// ----------------------------------------

var siteCoords = [];
var markers = {};
var markerLayer = L.layerGroup().addTo(map);

var info = L.control({position: 'topright'});
info.onAdd = function () {
  var div = L.DomUtil.create('div', 'info');
  div.innerHTML = '<b>観測所数:</b> 0';
  return div;
};
info.addTo(map);

var colorMap = {
  d:'#0000CD', e:'#0024E3', f:'#000ED6', g:'#0048FA',
  h:'#008CC2', i:'#00D08B', j:'#1FE460', k:'#7DFC21',
  l:'#BDFF0C', m:'#DEFF05', n:'#FFFF00', o:'#FFEE00',
  p:'#FFDD00', q:'#FFB600', r:'#FF9000', s:'#FF6A00',
  t:'#FF4400', u:'#FA2100', v:'#F50000', w:'#D00000'
};

// sitelist.json
fetch('https://weather-kyoshin.west.edge.storage-yahoo.jp/SiteList/sitelist.json')
  .then(r => r.json())
  .then(data => {
    siteCoords = data.items;
    info.getContainer().innerHTML = '<b>観測点数:</b> ' + siteCoords.length;
    updateMarkers();
  })
  .catch(e => console.error('sitelist読み込み失敗', e));

function getRealTimeUrlMinus1Sec() {
  var now = new Date();
  now.setSeconds(now.getSeconds() - 1);
  var YYYY = now.getFullYear();
  var MM = String(now.getMonth()+1).padStart(2,'0');
  var DD = String(now.getDate()).padStart(2,'0');
  var HH = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  var SS = String(now.getSeconds()).padStart(2,'0');
  return `https://weather-kyoshin.west.edge.storage-yahoo.jp/RealTimeData/${YYYY}${MM}${DD}/${YYYY}${MM}${DD}${HH}${mm}${SS}.json`;
}

function updateMarkers() {
  if(siteCoords.length === 0) return;

  var url = getRealTimeUrlMinus1Sec();
  fetch(url)
    .then(r => {
      if(!r.ok) throw new Error('データなし');
      return r.json();
    })
    .then(data => {
      var intensities = data.realTimeData.intensity;

      // ★ 完全固定サイズ（縮小も拡大もしない）
      var radius = 2;

      for (let i = 0; i < intensities.length; i++) {
        var code = intensities.charAt(i);
        if(code === 'c') continue;

        if(!markers[i]) {
          var lat = siteCoords[i][0];
          var lng = siteCoords[i][1];
          markers[i] = L.circleMarker([lat, lng], {
            radius: radius,
            fillColor: colorMap[code] || '#AA0000',
            color: '#fff',
            weight: 0.2,
            opacity: 1,
            fillOpacity: 1
          }).addTo(markerLayer);
        } else {
          markers[i].setStyle({
            radius: radius,
            fillColor: colorMap[code] || '#AA0000',
            color: '#fff',
            weight: 0.2,
            fillOpacity: 1
          });
        }
      }
    })
    .catch(e => console.error('リアルタイムデータ取得失敗', e));
}

// 更新処理
setInterval(updateMarkers, 1000);

// ズーム時もサイズ変えず維持
map.on('zoomend', updateMarkers);
</script>

</body>
</html>
