<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>

<style>
# map {
    width: 100%;
    height: 600px;
}
</style>

</head>

<body>
<div id="map"></div>

<script>
const tokenID = "[TOKEN from https://maps.developer.apple.com/token-maker]";

mapkit.init({
    authorizationCallback: function(done) {
        done(tokenID);
    }
});

var map = new mapkit.Map("map");
</script>
</body>
</html>
