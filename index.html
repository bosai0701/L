<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>緊急地震速報（EEW）ビューワ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --bg: #0b1020;
  --card: #121a33;
  --text: #eaeff7;
  --muted: #9fb0c7;
  --ok: #2dd36f;
  --warn: #ffcc00;
  --bad: #ff4d4f;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; }
header { padding: 14px 16px; display:flex; gap:10px; align-items:center; border-bottom: 1px solid #223; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .06em; }
#statusBadge { padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
#statusBadge.ok { background: #11331f; color: var(--ok); }
#statusBadge.warn { background: #332f11; color: var(--warn); }
#statusBadge.bad { background: #331112; color: var(--bad); }
main { display: grid; grid-template-columns: 420px 1fr; gap: 14px; padding: 14px; }
@media (max-width: 980px){ main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid #223; border-radius: 10px; padding: 14px; }
.kvs { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; }
.kvs div.key { color: var(--muted); text-align: right; }
.big { font-size: 20px; font-weight: 800; letter-spacing: .04em; }
#map { height: 62vh; min-height: 360px; border-radius: 10px; overflow: hidden; }
.footer { color: var(--muted); font-size: 12px; display:flex; gap: 12px; align-items:center; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
</style>
</head>
<body>
<header>
<h1>緊急地震速報（EEW）</h1>
<span id="statusBadge" class="ok">EEW発表なし</span>
<div class="footer" id="meta">
<span>取得時刻: <span id="targetTime" class="mono">--</span></span>
<span>現在時刻: <span id="updatedAt" class="mono">--</span></span>
</div>
</header>

<main>
<section class="card" id="infoCard">
<div class="big" id="headline">緊急地震速報は発表されていません</div>
<div style="height:10px"></div>
<div class="kvs">
<div class="key">震源</div><div id="region">--</div>
<div class="key">発生時刻</div><div id="originTime">--</div>
<div class="key">最大推定震度</div><div id="calcIntensity">--</div>
<div class="key">マグニチュード</div><div id="magnitude">--</div>
<div class="key">深さ</div><div id="depth">--</div>
<div class="key">緯度/経度</div><div id="latlon">--</div>
<div class="key">レポートID/番号</div><div id="report">--</div>
<div class="key">P波半径</div><div id="pRadius">--</div>
<div class="key">S波半径</div><div id="sRadius">--</div>
</div>
<div style="height:12px"></div>
<div class="footer">
<span>データ: Yahoo!天気「リアルタイム震度」JSON</span>
</div>
</section>

<section class="card">
<div id="map"></div>
</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TZ_OFFSET_MIN = 9 * 60;
const pad = (n, w=2) => String(n).padStart(w, '0');
function toJSTDate(d=new Date()){ const utc = d.getTime() + (d.getTimezoneOffset()*60000); return new Date(utc + TZ_OFFSET_MIN*60000); }
function formatJST(d){ const y=d.getFullYear(), m=pad(d.getMonth()+1), dd=pad(d.getDate()), hh=pad(d.getHours()), mm=pad(d.getMinutes()), ss=pad(d.getSeconds()); return { ymd:`${y}${m}${dd}`, ymdhms:`${y}${m}${dd}${hh}${mm}${ss}`, iso:`${y}-${m}-${dd} ${hh}:${mm}:${ss} JST` }; }

function buildUrl(secAgo = 1){ const nowJST = toJSTDate(); nowJST.setSeconds(nowJST.getSeconds()-secAgo); const f=formatJST(nowJST); return { url:`https://weather-kyoshin.west.edge.storage-yahoo.jp/RealTimeData/${f.ymd}/${f.ymdhms}.json`, human:f.iso }; }

const map = L.map('map', { zoomControl:true, attributionControl:true }).setView([36.5,137.5],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);

const epicenterMarker = L.circleMarker([0,0], { radius:6, color:'#fff', weight:2, fillColor:'#ff4d4f', fillOpacity:0.9 }).addTo(map);
const pCircle = L.circle([0,0], { radius:0, color:'#399ade', fillColor:'#399ade', fillOpacity:0.25 }).addTo(map);
const sCircle = L.circle([0,0], { radius:0, color:'#dc143c', fillColor:'#dc143c', fillOpacity:0.12 }).addTo(map);

// DOM参照
const $targetTime=document.getElementById('targetTime'), $updatedAt=document.getElementById('updatedAt'), $badge=document.getElementById('statusBadge');
const $headline=document.getElementById('headline'), $region=document.getElementById('region'), $originTime=document.getElementById('originTime');
const $calcIntensity=document.getElementById('calcIntensity'), $magnitude=document.getElementById('magnitude'), $depth=document.getElementById('depth');
const $latlon=document.getElementById('latlon'), $report=document.getElementById('report'), $pRadius=document.getElementById('pRadius'), $sRadius=document.getElementById('sRadius');

let animState = { pRadius:0, sRadius:0 };
function animateCircle(target, key, duration=0.5){
  const start = animState[key] ?? 0;
  const end = target;
  const startTime = performance.now();
  function step(now){
    const t = Math.min((now-startTime)/(duration*1000),1);
    animState[key] = start + (end-start)*t;
    if(key==='pRadius') pCircle.setRadius(animState[key]);
    else sCircle.setRadius(animState[key]);
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function fetchKyoshinJson(){
  let lastError;
  for(let back=2;back<=10;back++){
    const { url, human }=buildUrl(back);
    $targetTime.textContent = human;
    try{
      const res = await fetch(url,{ cache:'no-store' });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      render(json);
      return;
    }catch(e){ lastError=e; }
  }
  $headline.textContent='データ取得エラー（再試行中）';
  $badge.className='bad'; $badge.textContent='エラー';
  console.error('Fetch failed:', lastError);
}

function render(data){
  const nowDisp=formatJST(toJSTDate());
  $updatedAt.textContent=nowDisp.iso;
  const hypo=data?.hypoInfo?.items?.[0]??null;
  const ps=data?.psWave?.items?.[0]??null;
  const hasEEW=!!(hypo&&ps);

  if(hasEEW){
    $badge.className='warn'; $badge.textContent='EEW発表中';
    $headline.textContent=`${hypo.regionName??'震源不明'} / M${hypo.magnitude??'?'}  震度推定: ${hypo.calcintensity??'-'}`;
    // 詳細情報表示
    document.querySelectorAll('#infoCard .kvs > div').forEach(el => el.style.display='block');
  }else{
    $badge.className='ok'; $badge.textContent='EEW発表なし';
    $headline.textContent='緊急地震速報は発表されていません';
    // 詳細情報非表示
    document.querySelectorAll('#infoCard .kvs > div').forEach(el => el.style.display='none');
  }

  $region.textContent=hypo?`${hypo.regionName}`:'—';
  $originTime.textContent=hypo?.originTime??'—';
  $calcIntensity.textContent=hypo?.calcintensity??'—';
  $magnitude.textContent=hypo?.magnitude??'—';
  $depth.textContent=hypo?.depth??'—';
  if(hypo?.latitude&&hypo?.longitude) $latlon.textContent=`${hypo.latitude} / ${hypo.longitude}`;
  else $latlon.textContent='—';
  $report.textContent=hypo?`${hypo.reportId??'-'} / #${hypo.reportNum??'-'}`:'—';

  if(ps && hypo?.latitude && hypo?.longitude){
    const toDeg=s=>{ const dir=s[0], val=parseFloat(s.slice(1)); if(Number.isNaN(val)) return null; return (dir==='S'||dir==='W')?-val:val; };
    const lat=toDeg(hypo.latitude), lon=toDeg(hypo.longitude);

    epicenterMarker.setLatLng([lat,lon]).setStyle({ opacity:1 });

    const pRkm=parseFloat(ps.pRadius), sRkm=parseFloat(ps.sRadius);
    animateCircle(Number.isFinite(pRkm)?pRkm*1000:0,'pRadius');
    animateCircle(Number.isFinite(sRkm)?sRkm*1000:0,'sRadius');

    $pRadius.textContent=Number.isFinite(pRkm)?`${pRkm.toFixed(1)} km`:'—';
    $sRadius.textContent=Number.isFinite(sRkm)?`${sRkm.toFixed(1)} km`:'—';
  }else{
    animateCircle(0,'pRadius'); animateCircle(0,'sRadius');
    epicenterMarker.setStyle({ opacity:0 });
    $pRadius.textContent='—'; $sRadius.textContent='—';
  }
}

// 自動更新
fetchKyoshinJson();
setInterval(fetchKyoshinJson,1000);
</script>
</body>
</html>
