<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>強震モニタ 高速版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>

  <style>
    #map { height: 100vh; width:100%; }
    .info {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      padding: 6px 8px;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="info"><b>観測点数:</b> 0</div>

<script>
// ----------------------------------------
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      google: {
        type: "raster",
        tiles: [
          "https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
        ],
        tileSize: 256
      }
    },
    layers: [
      { id: "google", type: "raster", source: "google" }
    ]
  },
  center: [134.5, 34.5],
  zoom: 3,
  maxZoom: 9,
  minZoom: 3,
  attributionControl: false
});

// ----------------------------------------
var infoBox = document.querySelector(".info");

var colorMap = {
  d:'#0000CD', e:'#0024E3', f:'#000ED6', g:'#0048FA',
  h:'#008CC2', i:'#00D08B', j:'#1FE460', k:'#7DFC21',
  l:'#BDFF0C', m:'#DEFF05', n:'#FFFF00', o:'#FFEE00',
  p:'#FFDD00', q:'#FFB600', r:'#FF9000', s:'#FF6A00',
  t:'#FF4400', u:'#FA2100', v:'#F50000', w:'#D00000',
  x:'#AA0000'
};

// GeoJSON (マーカー全体)
var geojson = {
  type: "FeatureCollection",
  features: []
};

// MapLibre用データソース
map.on("load", () => {
  map.addSource("points", {
    type: "geojson",
    data: geojson
  });

  map.addLayer({
    id: "points-layer",
    type: "circle",
    source: "points",
    paint: {
      "circle-radius": 2,
      "circle-color": ["get", "color"],
      "circle-stroke-color": "#ffffff",
      "circle-stroke-width": 0.2,
      "circle-opacity": 1
    }
  });
});

var siteCoords = [];
var markersCount = 0;

// サイトリスト取得
fetch('https://weather-kyoshin.west.edge.storage-yahoo.jp/SiteList/sitelist.json')
  .then(r => r.json())
  .then(data => {
    siteCoords = data.items;
    updateMarkers();
  });

// ----------------------------------------
function getRealTimeUrl(secondsAgo = 5) {
  var now = new Date();
  now.setSeconds(now.getSeconds() - secondsAgo);
  var YYYY = now.getFullYear();
  var MM = String(now.getMonth()+1).padStart(2,'0');
  var DD = String(now.getDate()).padStart(2,'0');
  var HH = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  var SS = String(now.getSeconds()).padStart(2,'0');
  return `https://weather-kyoshin.west.edge.storage-yahoo.jp/RealTimeData/${YYYY}${MM}${DD}/${YYYY}${MM}${DD}${HH}${mm}${SS}.json`;
}

let loading = false;

// ----------------------------------------
function updateMarkers() {
  if(loading || siteCoords.length===0) return;
  loading = true;

  fetch(getRealTimeUrl())
    .then(r=>{ if(!r.ok) throw new Error("データなし"); return r.json(); })
    .then(data=>{
      var intensities = data.realTimeData.intensity;
      var N = Math.min(intensities.length, siteCoords.length);

      geojson.features = [];
      markersCount = 0;

      for(let i=0;i<N;i++){
        var code = intensities.charAt(i);
        if(code==='c') continue;

        markersCount++;

        geojson.features.push({
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [siteCoords[i][1], siteCoords[i][0]]
          },
          properties: {
            color: colorMap[code] || "#AA0000"
          }
        });
      }

      map.getSource("points").setData(geojson);

      infoBox.innerHTML = "<b>観測点数:</b> " + markersCount;
    })
    .catch(e=>console.warn("リアルタイム取得失敗（丸保持）", e))
    .finally(()=>{ loading=false; });
}

// 0.1秒ごと更新
setInterval(updateMarkers,100);
</script>
</body>
</html>
